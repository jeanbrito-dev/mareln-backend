services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mareln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-mareln}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    image: mareln-backend-migrations
    build:
      context: .
      target: migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mareln}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-mareln}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: mareln-backend
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-mareln}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-mareln}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
