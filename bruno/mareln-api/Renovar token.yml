info:
  name: Renovar token
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3001/auth/refresh
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshTokenDivulgador}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
