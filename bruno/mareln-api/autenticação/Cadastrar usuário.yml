info:
  name: Cadastrar usuário
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3001/auth/register
  body:
    type: json
    data: |-
      {
        "nome": "Novo Visitante",
        "email": "novo-visitante@mareln.local",
        "senha": "{{senhaCadastro}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
